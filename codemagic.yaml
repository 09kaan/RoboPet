workflows:
  ios-testflight:
    name: iOS TestFlight Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Key"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on macOS builder
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "com.kaan.robopet" --type IOS_APP_STORE --create || { echo "Codemagic failed to fetch signing files from Apple! Look at the error above."; exit 1; }
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Flutter iOS app
        script: |
          flutter build ios --release --no-codesign
          
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "FATAL ERROR: No provisioning profiles found!"
            echo "Codemagic could not download the profile from Apple."
            echo "Please check if your Apple Developer account has pending agreements to sign, or if com.kaan.robopet App ID is valid."
            exit 1
          fi
          
          xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme "Runner" --config "Release"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
